name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meeting-foreigners-in-japan
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build
        env:
          # Build-time placeholder only; CI does not connect to this database.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/enjapan_ci
